[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rumor-llm-study"
version = "1.0.0"
description = "Auditable LLM agent rumor correction experiment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl==3.1.5", "xlrd==2.0.2"]

[project.scripts]
rumor-study = "rumor_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
